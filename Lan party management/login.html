<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laban.gg
</title>
<style>
    :root {
        --bg: #000000;
        --card: rgba(20, 20, 20, 0.88);
        --text: #ffffff;
        --muted: #808080;
        --accent: #0066cc;
        --accent-light: #3385ff;
        --border: rgba(255, 255, 255, 0.2);
    }

    * { 
        box-sizing: border-box; 
    }

    body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 15% 15%, #25205a 0, transparent 35%),
                    radial-gradient(circle at 85% 85%, #142e52 0, transparent 35%), var(--bg);
    }

    .login-card {
        width: min(100%, 430px);
        padding: 42px;
        border: 1px solid var(--border);
        border-radius: 24px;
        background: var(--card);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(14px);
    }

    .brand { 
        margin-bottom: 32px; 
        text-align: center; 
    }

    .logo {
        width: 54px;
        height: 54px;
        display: grid;
        place-items: center;
        margin: 0 auto 18px;
        border-radius: 16px;
        color: white;
        font-size: 26px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), #28c7ff);
    }
    h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -0.5px; }
    .subtitle { margin: 0; color: var(--muted); font-size: 14px; }

    form { 
        display: grid; 
        gap: 18px; 
    }

    label { 
        display: block; 
        margin-bottom: 8px; 
        color: #dfe3f4; 
        font-size: 13px; 
        font-weight: 600; 
    }

    input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid var(--border);
        border-radius: 11px;
        outline: none;
        color: var(--text);
        font: inherit;
        background: rgba(255, 255, 255, 0.06);
        transition: border-color .2s, box-shadow .2s;
    }
    input:focus { 
        border-color: var(--accent-light); 
        box-shadow: 0 0 0 3px rgba(124, 92, 255, .2); 
    }

    .options { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        gap: 12px; 
        font-size: 13px; 
    }

    .remember { 
        display: flex; 
        align-items: center; 
        gap: 8px; 
        color: var(--muted); 
    }
    .remember input { 
        width: 16px; 
        height: 16px; 
        accent-color: var(--accent);
    }
    a { 
        color: var(--accent-light); 
        text-decoration: none; 
    }
    a:hover { 
        text-decoration: underline; 
    }

    button {
        width: 100%;
        padding: 14px;
        border: 0;
        border-radius: 11px;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        background: linear-gradient(135deg, var(--accent), #5d9bff);
        transition: transform .2s, filter .2s;
    }

    button:hover { 
        filter: brightness(1.1); 
        transform: translateY(-1px); 
    }
    .signup { 
        margin: 26px 0 0; 
        color: var(--muted); 
        text-align: center; 
        font-size: 14px; 
    }

    @media (max-width: 480px) {
        .login-card { 
            padding: 30px 22px; 
        }
    }
</style>
</head>
<body>
    <main class="login-card">
        <header class="brand">
        <div class="logo" aria-hidden="true">LP</div>
        <h1>Welcome back</h1>
        <p class="subtitle">Sign in to manage your Team or join Tournaments</p>
        </header>

        <form action="#" method="post">
        <div>
            <label for="email">Email address</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <div class="options">
            <label class="remember"><input type="checkbox" name="remember"> Remember me</label>
            <a href="#forgot-password">Forgot password?</a>
        </div>
        <button type="submit">Sign in</button>
        </form>
        <p class="signup">New to Laban.gg? <a href="registration.html">Create an account</a></p>

    </main>
</body>
</html>
