<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LAN Party Registration</title>
    <style>
        :root {
            --bg: #0b1020;
            --card: rgba(20, 20, 20, 0.88);
            --text: #f7f8ff;
            --muted: #9aa5c4;
            --accent: #7c5cff;
            --accent-light: #9e8aff;
            --border: rgba(255, 255, 255, 0.12);
        }

        * { 
            box-sizing: border-box; 
        }

    body {
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 15% 15%, #25205a 0, transparent 35%),
                    radial-gradient(circle at 85% 85%, #142e52 0, transparent 35%), var(--bg);
    }

        main {
            width: min(760px, 92%); 
            margin: 40px auto; 
        }

        h1 {
            margin-bottom: 8px; 
            text-align: center; 
        }

        .intro { 
            color: var(--muted); 
            text-align: center; 
            margin-bottom: 28px; 
        }
        
            form { 
            background: var(--card); 
            padding: 28px; 
            border-radius: 14px; 
            box-shadow: 0 12px 35px #0005; 
        }
        
        fieldset { 
            border: 1px solid #3b4260; 
            border-radius: 10px; 
            padding: 20px; 
            margin: 0 0 22px; 
        }
        
        legend { 
            padding: 0 8px; 
            font-size: 1.15rem; 
            font-weight: bold; 
            color: #bdb9ff;
        }
    
        .grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
        }
        
        label { 
            display: flex; 
            flex-direction: column; 
            gap: 7px; 
            font-weight: bold; 
        }
        
        .full { 
            grid-column: 1 / -1; 
        }
        
        input, 
        select, 
        textarea { 
            width: 100%; 
            padding: 11px; 
            border: 1px solid #505875; 
            border-radius: 6px; 
            background: #111522; 
            color: var(--text); 
            font: inherit; 
        }
        
        input:focus, 
        select:focus, 
        textarea:focus { 
            outline: 2px solid var(--accent); 
            border-color: transparent; 
        }

        .member { 
            position: relative; 
            padding: 16px; 
            margin-top: 14px; 
            border: 1px solid #353c57; 
            border-radius: 8px; 
        }
        
        .member h3 { 
            margin: 0 0 14px; 
            font-size: 1rem; 
            color: #d7d5ff; 
        }
        
        .hint { 
            color: var(--muted); 
            font-size: .9rem; 
            font-weight: normal; 
        }

        .confirmation { 
            flex-direction: row; 
            align-items: center; 
        }

        .confirmation input[type="checkbox"] { 
            width: auto; 
        }

        button { 
            border: 0; 
            border-radius: 7px; 
            padding: 12px 18px; 
            color: white; 
            background: var(--accent); 
            font-weight: bold; 
            cursor: pointer; 
        }

        button:hover { 
            background: #817aff; 
        }

        .secondary { 
            margin-top: 14px; 
            background: #343b59; 
        }

        .actions { 
            display: flex; 
            justify-content: flex-end; 
            gap: 12px; 
        }

        @media (max-width: 600px) { 
            .grid { grid-template-columns: 1fr; } 
            .full { grid-column: auto; } 
            form { padding: 18px; }
        }
    </style>
</head>
    <body>
        <main>
            <h1>LAN Party Registration</h1>
            <p class="intro">Register your team and add every member attending the event.</p>

            <form id="registrationForm">
            <fieldset>
                <legend>Team details</legend>
                <div class="grid">
                <label>Team name *<input type="text" name="teamName" required maxlength="50" placeholder="e.g. Pixel Warriors"></label>
                <label>Game *
                    <select name="game" required>
                    <option value="">Choose a game</option>
                    <option>Counter-Strike 2</option><option>League of Legends</option><option>Rocket League</option><option>Valorant</option><option>Other</option>
                    </select>
                </label>
                <label>Team captain *<input type="text" name="captain" required placeholder="Captain's name"></label>
                <label>Contact email *<input type="email" name="email" required placeholder="captain@example.com"></label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Team members</legend>
                <p class="hint">Add at least one member. Include the captain in the list.</p>
                <div id="members">
                <div class="member">
                    <h3>Member 1</h3>
                    <div class="grid">
                    <label>Full name *<input type="text" name="memberName[]" required></label>
                    <label>Gamer tag *<input type="text" name="gamerTag[]" required></label>
                    </div>
                </div>
                </div>
                <button type="button" class="secondary" id="addMember">+ Add member</button>
                <button type="button" class="secondary" id="removeMember" hidden>- Remove member</button>
            </fieldset>

            <fieldset>
                <legend>Additional information</legend>
                <label>Notes or accessibility requirements<textarea name="notes" rows="4" placeholder="Optional"></textarea></label>
            </fieldset>

            <label class="hint confirmation"><input type="checkbox" required> I confirm that the information provided is correct.</label>
            <div class="actions"><button type="submit">Register team</button></div>
            <p id="message" role="status" aria-live="polite"></p>
            </form>
        </main>
        <script>
            const members = document.getElementById('members');
            const removeMember = document.getElementById('removeMember');
            const updateRemoveButton = () => {
            removeMember.hidden = members.children.length <= 1;
            };

            document.getElementById('addMember').addEventListener('click', () => {
            const number = members.children.length + 1;
            const member = document.createElement('div');
            member.className = 'member';
            member.innerHTML = `<h3>Member ${number}</h3><div class="grid"><label>Full name *<input type="text" 
                name="memberName[]" required></label><label>Gamer tag *<input type="text" name="gamerTag[]" required></label></div>`;
            members.appendChild(member);
            updateRemoveButton();
            });

            
            removeMember.addEventListener('click', () => {
            if (members.children.length > 1) {
                members.removeChild(members.lastChild);
                updateRemoveButton();
            }
            });

            document.getElementById('registrationForm').addEventListener('submit', event => {
            event.preventDefault();
            document.getElementById('message').textContent = 'Team registration submitted successfully!';
            });

        </script>
    </body>
</html>
